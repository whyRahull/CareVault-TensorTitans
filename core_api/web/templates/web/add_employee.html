{% extends 'web/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md overflow-hidden mt-10">
    <div class="px-6 py-8">
        <div class="flex items-center mb-6">
            <a href="{% url 'web:org_panel' %}" class="text-indigo-600 hover:text-indigo-900 mr-4">&larr; Back</a>
            <h2 class="text-2xl font-bold text-gray-800">Add New Employee</h2>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                {% for field in form %}
                <div class="{% if field.name == 'guardian_emails' %}md:col-span-2{% endif %}">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                        {{ field.label}}</label>
                    <div class="mt-1">
                        {{ field }}
                    </div>
                    {% if field.help_text %}
                    <p class="mt-2 text-sm text-gray-500">{{ field.help_text }}</p>
                    {% endif %}
                    {% if field.errors %}
                    <div class="mt-1 text-sm text-red-600">
                        {{ field.errors }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-4 border-t border-gray-200">
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Create Employee
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
